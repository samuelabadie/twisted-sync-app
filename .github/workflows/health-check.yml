name: Health Check

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        id: health
        run: |
          API_URL="${{ secrets.VERCEL_APP_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://twisted-sync-app.vercel.app"
          fi

          HTTP_STATUS=$(curl -sf -o /tmp/health.json -w "%{http_code}" \
            --max-time 30 \
            -X GET "${API_URL}/api/health")

          echo "status=$HTTP_STATUS" >> $GITHUB_OUTPUT
          echo "Response (HTTP $HTTP_STATUS):"
          cat /tmp/health.json 2>/dev/null || echo "(no response body)"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
        run: |
          if [ -z "$BREVO_API_KEY" ] || [ -z "$ALERT_EMAIL" ]; then
            echo "Alert skipped: BREVO_API_KEY or ALERT_RECIPIENT_EMAIL not configured"
            exit 0
          fi

          SENDER="${BREVO_SENDER_EMAIL:-noreply@twisted.com}"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          curl -s -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "accept: application/json" \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "content-type: application/json" \
            -d "{
              \"sender\": {\"name\": \"Twisted Sync\", \"email\": \"${SENDER}\"},
              \"to\": [{\"email\": \"${ALERT_EMAIL}\"}],
              \"subject\": \"[TWISTED ALERT] Health check failed - app may be down\",
              \"textContent\": \"Le health check de l'app a echoue a ${TIMESTAMP}.\\nL'application est peut-etre hors service.\\n\\nVerifier les logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
